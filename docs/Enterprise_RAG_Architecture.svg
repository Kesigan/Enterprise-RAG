<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title description">
  <title id="title">Enterprise RAG reference architecture</title>
  <desc id="description">Architecture for the browser workspace, FastAPI routes, LangGraph chat workflow, document ingestion, and connected storage and AI services.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#142132"/>
      <stop offset="1" stop-color="#20394a"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1">
      <stop offset="0" stop-color="#f0f8f6"/>
      <stop offset="1" stop-color="#f3f6fb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#243b53" flood-opacity=".07"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#6c9695"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7293b4"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { fill: #f7fbfd; font-size: 32px; font-weight: 700; letter-spacing: -.5px; }
      .subtitle { fill: #c3d2de; font-size: 14px; font-weight: 450; }
      .section { fill: #617182; font-size: 11px; font-weight: 750; letter-spacing: 1.5px; }
      .card-title { fill: #243444; font-size: 17px; font-weight: 700; }
      .body { fill: #607181; font-size: 12px; font-weight: 450; }
      .small { fill: #738391; font-size: 10px; font-weight: 500; }
      .step-title { fill: #354859; font-size: 12px; font-weight: 700; }
      .step-body { fill: #748391; font-size: 10px; font-weight: 450; }
      .white { fill: #fff; }
      .teal { fill: #087f82; }
      .muted { fill: #a4b3c0; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#f4f6fa"/>

  <rect x="40" y="28" width="1720" height="92" rx="20" fill="url(#header)"/>
  <rect x="66" y="49" width="48" height="48" rx="14" fill="#254451" stroke="#477c79"/>
  <rect x="79" y="66" width="5" height="15" rx="2.5" fill="#79d8c6" opacity=".8"/>
  <rect x="88" y="59" width="5" height="28" rx="2.5" fill="#79d8c6"/>
  <rect x="97" y="63" width="5" height="21" rx="2.5" fill="#79d8c6" opacity=".9"/>
  <text x="132" y="72" class="title">Enterprise RAG Architecture</text>
  <text x="133" y="96" class="subtitle">Document ingestion · grounded answers · human review</text>
  <rect x="1500" y="57" width="224" height="34" rx="17" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".16"/>
  <circle cx="1520" cy="74" r="4" fill="#75cfad"/>
  <text x="1534" y="78" class="white" font-size="10" font-weight="700" letter-spacing="1">REFERENCE ARCHITECTURE</text>

  <text x="48" y="143" class="section">USER EXPERIENCE</text>
  <rect x="40" y="155" width="1720" height="104" rx="16" fill="#fff" stroke="#e2e8ee" filter="url(#shadow)"/>
  <rect x="61" y="176" width="58" height="58" rx="15" fill="url(#hero)" stroke="#dcebe7"/>
  <path d="M79 193h21M79 200h16M79 207h12" stroke="#16847b" stroke-width="2.2" stroke-linecap="round"/>
  <text x="136" y="191" class="card-title">Browser workspace</text>
  <text x="136" y="212" class="body">FastAPI-served HTML, CSS and JavaScript</text>
  <text x="136" y="232" class="small">One interface for enterprise knowledge workflows</text>
  <line x1="490" y1="174" x2="490" y2="240" stroke="#e7ecef"/>
  <g>
    <rect x="521" y="182" width="344" height="49" rx="10" fill="#f7fafb" stroke="#e8edf0"/>
    <circle cx="546" cy="206" r="13" fill="#e1f1ed"/>
    <text x="546" y="210" text-anchor="middle" fill="#16847b" font-size="12" font-weight="800">1</text>
    <text x="568" y="203" class="step-title">Knowledge chat</text>
    <text x="568" y="219" class="small">Answers with source citations</text>
    <rect x="882" y="182" width="344" height="49" rx="10" fill="#f7fafb" stroke="#e8edf0"/>
    <circle cx="907" cy="206" r="13" fill="#e8eff9"/>
    <text x="907" y="210" text-anchor="middle" fill="#507cab" font-size="12" font-weight="800">2</text>
    <text x="929" y="203" class="step-title">Document library</text>
    <text x="929" y="219" class="small">Upload and view processing status</text>
    <rect x="1243" y="182" width="490" height="49" rx="10" fill="#f7fafb" stroke="#e8edf0"/>
    <circle cx="1268" cy="206" r="13" fill="#f6eee0"/>
    <text x="1268" y="210" text-anchor="middle" fill="#a8782d" font-size="12" font-weight="800">3</text>
    <text x="1290" y="203" class="step-title">Approvals and system overview</text>
    <text x="1290" y="219" class="small">Review decisions, metrics and guardrail events</text>
  </g>

  <path d="M900 259v16" stroke="#6c9695" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="48" y="295" class="section">APPLICATION LAYER</text>
  <rect x="40" y="307" width="1080" height="126" rx="16" fill="#fff" stroke="#dfe8ec" filter="url(#shadow)"/>
  <rect x="40" y="307" width="7" height="126" rx="3.5" fill="#16847b"/>
  <circle cx="76" cy="343" r="18" fill="#e2f2ee"/>
  <text x="76" y="349" text-anchor="middle" fill="#16847b" font-size="16" font-weight="800">F</text>
  <text x="108" y="340" class="card-title">FastAPI REST API</text>
  <text x="108" y="361" class="body">Routes for chat, document upload/completion, conversations, feedback, approvals and metrics</text>
  <text x="108" y="385" class="small">Presigned browser-to-S3 upload · completion route starts synchronous ingestion</text>
  <rect x="752" y="327" width="338" height="83" rx="11" fill="#f5f8fa" stroke="#e8edf0"/>
  <text x="769" y="349" class="section">KEY ROUTES</text>
  <text x="769" y="369" class="small">POST /api/chat · /api/documents/uploads</text>
  <text x="769" y="386" class="small">POST /api/documents/complete · /api/approvals/{id}/decision</text>
  <text x="769" y="402" class="small">GET /api/documents · /api/approvals · /api/admin/metrics</text>

  <rect x="1140" y="307" width="620" height="126" rx="16" fill="#fffaf0" stroke="#efe2c7" filter="url(#shadow)"/>
  <rect x="1140" y="307" width="7" height="126" rx="3.5" fill="#c69344"/>
  <circle cx="1176" cy="343" r="18" fill="#f6eddc"/>
  <text x="1176" y="349" text-anchor="middle" fill="#a8782d" font-size="16" font-weight="800">H</text>
  <text x="1208" y="340" class="card-title">Human review (HITL)</text>
  <text x="1208" y="363" class="body">Configured sensitive requests create a pending record.</text>
  <text x="1208" y="383" class="body">Admins approve or reject; the decision is recorded only.</text>
  <text x="1208" y="405" class="small">No requested action is executed automatically.</text>

  <path d="M520 433v12" stroke="#6c9695" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1060 433v12" stroke="#7293b4" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M1121 370h15" stroke="#c69344" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="455" width="840" height="330" rx="16" fill="#fff" stroke="#dfe8ec" filter="url(#shadow)"/>
  <rect x="40" y="455" width="840" height="48" rx="16" fill="#eaf5f2"/>
  <path d="M40 487v16h840v-16" fill="#eaf5f2"/>
  <circle cx="68" cy="479" r="13" fill="#16847b"/>
  <text x="68" y="483" text-anchor="middle" class="white" font-size="10" font-weight="800">01</text>
  <text x="91" y="484" class="card-title" font-size="15">Grounded chat · LangGraph workflow</text>
  <rect x="756" y="466" width="102" height="25" rx="12.5" fill="#fff" stroke="#d6e8e2"/>
  <text x="807" y="482" text-anchor="middle" fill="#398179" font-size="9" font-weight="700">RAG FLOW</text>

  <g>
    <rect x="58" y="523" width="144" height="186" rx="11" fill="#fbfcfd" stroke="#e5ebef"/>
    <circle cx="78" cy="546" r="12" fill="#e2f2ee"/><text x="78" y="550" text-anchor="middle" fill="#16847b" font-size="10" font-weight="800">1</text>
    <text x="74" y="580" class="step-title">Input checks</text>
    <text x="74" y="602" class="step-body"><tspan x="74">Request screening</tspan><tspan x="74" dy="15">and input guardrails</tspan><tspan x="74" dy="15">before retrieval.</tspan></text>

    <rect x="218" y="523" width="144" height="186" rx="11" fill="#fbfcfd" stroke="#e5ebef"/>
    <circle cx="238" cy="546" r="12" fill="#e8eff9"/><text x="238" y="550" text-anchor="middle" fill="#507cab" font-size="10" font-weight="800">2</text>
    <text x="234" y="580" class="step-title">Conversation</text>
    <text x="234" y="602" class="step-body"><tspan x="234">Load recent turns</tspan><tspan x="234" dy="15">from PostgreSQL for</tspan><tspan x="234" dy="15">follow-up context.</tspan></text>

    <rect x="378" y="523" width="144" height="186" rx="11" fill="#fbfcfd" stroke="#e5ebef"/>
    <circle cx="398" cy="546" r="12" fill="#e8eff9"/><text x="398" y="550" text-anchor="middle" fill="#507cab" font-size="10" font-weight="800">3</text>
    <text x="394" y="580" class="step-title">Retrieve evidence</text>
    <text x="394" y="602" class="step-body"><tspan x="394">Titan query embedding;</tspan><tspan x="394" dy="15">Pinecone search with</tspan><tspan x="394" dy="15">group/owner filters.</tspan></text>

    <rect x="538" y="523" width="144" height="186" rx="11" fill="#fbfcfd" stroke="#e5ebef"/>
    <circle cx="558" cy="546" r="12" fill="#f3edfb"/><text x="558" y="550" text-anchor="middle" fill="#7954a5" font-size="10" font-weight="800">4</text>
    <text x="554" y="580" class="step-title">Generate answer</text>
    <text x="554" y="602" class="step-body"><tspan x="554">Nova Lite grounds</tspan><tspan x="554" dy="15">the response in</tspan><tspan x="554" dy="15">retrieved passages.</tspan></text>

    <rect x="698" y="523" width="164" height="186" rx="11" fill="#fbfcfd" stroke="#e5ebef"/>
    <circle cx="718" cy="546" r="12" fill="#e2f2ee"/><text x="718" y="550" text-anchor="middle" fill="#16847b" font-size="10" font-weight="800">5</text>
    <text x="714" y="580" class="step-title">Validate + cite</text>
    <text x="714" y="602" class="step-body"><tspan x="714">Output validation</tspan><tspan x="714" dy="15">returns the answer and</tspan><tspan x="714" dy="15">source citations.</tspan></text>

    <path d="M203 615h12M363 615h12M523 615h12M683 615h12" stroke="#82aaa5" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <text x="60" y="749" class="small">If no authorized passages meet the relevance threshold, the workflow returns a no-evidence response.</text>

  <rect x="900" y="455" width="860" height="330" rx="16" fill="#fff" stroke="#dfe8ec" filter="url(#shadow)"/>
  <rect x="900" y="455" width="860" height="48" rx="16" fill="#edf3fa"/>
  <path d="M900 487v16h860v-16" fill="#edf3fa"/>
  <circle cx="928" cy="479" r="13" fill="#507cab"/>
  <text x="928" y="483" text-anchor="middle" class="white" font-size="10" font-weight="800">02</text>
  <text x="951" y="484" class="card-title" font-size="15">Document ingestion · upload completion triggers processing</text>
  <rect x="1636" y="466" width="104" height="25" rx="12.5" fill="#fff" stroke="#dce6f0"/>
  <text x="1688" y="482" text-anchor="middle" fill="#507cab" font-size="9" font-weight="700">INGESTION</text>

  <g>
    <rect x="918" y="523" width="148" height="186" rx="11" fill="#fbfcfd" stroke="#e5ebef"/>
    <circle cx="938" cy="546" r="12" fill="#e8eff9"/><text x="938" y="550" text-anchor="middle" fill="#507cab" font-size="10" font-weight="800">1</text>
    <text x="934" y="580" class="step-title">Request upload</text>
    <text x="934" y="602" class="step-body"><tspan x="934">POST /uploads returns</tspan><tspan x="934" dy="15">a presigned URL; browser</tspan><tspan x="934" dy="15">sends the file to S3.</tspan></text>

    <rect x="1086" y="523" width="148" height="186" rx="11" fill="#fbfcfd" stroke="#e5ebef"/>
    <circle cx="1106" cy="546" r="12" fill="#f1ecfb"/><text x="1106" y="550" text-anchor="middle" fill="#7954a5" font-size="10" font-weight="800">2</text>
    <text x="1102" y="580" class="step-title">Upload to S3</text>
    <text x="1102" y="602" class="step-body"><tspan x="1102">Private S3 source</tspan><tspan x="1102" dy="15">object awaits processing</tspan><tspan x="1102" dy="15">after upload completion.</tspan></text>

    <rect x="1254" y="523" width="148" height="186" rx="11" fill="#fbfcfd" stroke="#e5ebef"/>
    <circle cx="1274" cy="546" r="12" fill="#e2f2ee"/><text x="1274" y="550" text-anchor="middle" fill="#16847b" font-size="10" font-weight="800">3</text>
    <text x="1270" y="580" class="step-title">Parse + chunk</text>
    <text x="1270" y="602" class="step-body"><tspan x="1270">/complete calls</tspan><tspan x="1270" dy="15">worker.ingest directly;</tspan><tspan x="1270" dy="15">extract + chunk.</tspan></text>

    <rect x="1422" y="523" width="148" height="186" rx="11" fill="#fbfcfd" stroke="#e5ebef"/>
    <circle cx="1442" cy="546" r="12" fill="#f3edfb"/><text x="1442" y="550" text-anchor="middle" fill="#7954a5" font-size="10" font-weight="800">4</text>
    <text x="1438" y="580" class="step-title">Create vectors</text>
    <text x="1438" y="602" class="step-body"><tspan x="1438">Titan V2 creates an</tspan><tspan x="1438" dy="15">embedding for each</tspan><tspan x="1438" dy="15">document chunk.</tspan></text>

    <rect x="1590" y="523" width="148" height="186" rx="11" fill="#fbfcfd" stroke="#e5ebef"/>
    <circle cx="1610" cy="546" r="12" fill="#e2f2ee"/><text x="1610" y="550" text-anchor="middle" fill="#16847b" font-size="10" font-weight="800">5</text>
    <text x="1606" y="580" class="step-title">Index + update</text>
    <text x="1606" y="602" class="step-body"><tspan x="1606">Upsert vectors to</tspan><tspan x="1606" dy="15">Pinecone; update status</tspan><tspan x="1606" dy="15">and audit in PostgreSQL.</tspan></text>

    <path d="M1067 615h15M1235 615h15M1403 615h15M1571 615h15" stroke="#88a0b7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  </g>
  <text x="920" y="749" class="small">Supported document types: PDF, DOCX, TXT and Markdown.</text>

  <text x="48" y="815" class="section">CONNECTED SERVICES</text>
  <g filter="url(#shadow)">
    <rect x="40" y="830" width="330" height="138" rx="14" fill="#fff" stroke="#e2e8ee"/>
    <rect x="386" y="830" width="330" height="138" rx="14" fill="#fff" stroke="#e2e8ee"/>
    <rect x="732" y="830" width="330" height="138" rx="14" fill="#fff" stroke="#e2e8ee"/>
    <rect x="1078" y="830" width="330" height="138" rx="14" fill="#fff" stroke="#e2e8ee"/>
    <rect x="1424" y="830" width="336" height="138" rx="14" fill="#fff" stroke="#e2e8ee"/>
  </g>
  <g>
    <circle cx="67" cy="859" r="12" fill="#f8e9e4"/><text x="67" y="863" text-anchor="middle" fill="#b95d43" font-size="9" font-weight="800">S3</text>
    <text x="88" y="864" class="step-title">Amazon S3</text>
    <text x="58" y="894" class="body"><tspan x="58">Stores original uploads in a private bucket.</tspan><tspan x="58" dy="18">Browser PUT uses a time-limited presigned URL.</tspan></text>

    <circle cx="413" cy="859" r="12" fill="#f5eddf"/><text x="413" y="863" text-anchor="middle" fill="#a8782d" font-size="9" font-weight="800">AI</text>
    <text x="434" y="864" class="step-title">Amazon Bedrock</text>
    <text x="404" y="894" class="body"><tspan x="404">Titan V2 for chunk/query embeddings.</tspan><tspan x="404" dy="18">Nova Lite for grounded answer generation.</tspan></text>

    <circle cx="759" cy="859" r="12" fill="#e8eff9"/><text x="759" y="863" text-anchor="middle" fill="#507cab" font-size="9" font-weight="800">V</text>
    <text x="780" y="864" class="step-title">Pinecone</text>
    <text x="750" y="894" class="body"><tspan x="750">Dense vector index for chunk embeddings</tspan><tspan x="750" dy="18">and metadata used in filtered retrieval.</tspan></text>

    <circle cx="1105" cy="859" r="12" fill="#e6f1ec"/><text x="1105" y="863" text-anchor="middle" fill="#3c816b" font-size="9" font-weight="800">DB</text>
    <text x="1126" y="864" class="step-title">PostgreSQL</text>
    <text x="1096" y="894" class="small"><tspan x="1096">documents · chat_messages · approvals</tspan><tspan x="1096" dy="17">feedback · audit_events</tspan></text>

    <circle cx="1451" cy="859" r="12" fill="#f5e9ec"/><text x="1451" y="863" text-anchor="middle" fill="#a85662" font-size="9" font-weight="800">O</text>
    <text x="1472" y="864" class="step-title">GlassFlow Rius</text>
    <text x="1442" y="894" class="body"><tspan x="1442">Optional traces for instrumented operations.</tspan><tspan x="1442" dy="18">Input/output content capture is disabled.</tspan></text>
  </g>

  <rect x="40" y="990" width="1720" height="67" rx="13" fill="#eaf1f5"/>
  <circle cx="68" cy="1023" r="13" fill="#d8e6ec"/>
  <text x="68" y="1028" text-anchor="middle" fill="#587783" font-size="13" font-weight="800">i</text>
  <text x="93" y="1018" class="step-title">Implementation notes</text>
  <text x="93" y="1038" class="body">The current demo uses a single-workspace principal. Add production authentication and authorization before multi-user deployment.</text>
  <text x="1718" y="1038" text-anchor="end" class="small">Approval decisions are recorded; they do not execute requested actions.</text>
</svg>
